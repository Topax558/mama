<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Бухгалтерские услуги, Аудит. Корпоративный сайт компании</title>
    
    <style>
        /* Базовые стили для мобильных */
        * {
            box-sizing: border-box;
        }
        
        body {
            font-size: 16px;
            line-height: 1.5;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            padding: 0 15px;
        }
        
        /* Адаптация шапки */
        #header {
            position: relative;
        }
        
        .header-top {
            flex-wrap: wrap;
            padding: 10px 0;
        }
        
        .header-logo {
            width: 100%;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .header-logo img {
            max-width: 150px;
            height: auto;
        }
        
        .header-address, 
        .header-phone,
        .header-btn-callback,
        .header-btn-zayvka {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }
        
        /* Меню */
        #horizontal-multilevel-menu {
            display: none;
        }
        
        .minmenu {
            display: block;
            background: #107bb1;
            color: white;
            padding: 10px;
            cursor: pointer;
        }
        
        /* Слайдер */
        .header-slider {
            height: 300px;
        }
        
        .header-slider__title {
            font-size: 24px;
        }
        
        .header-slider__desc {
            font-size: 14px;
        }
        
        /* Блоки услуг */
        .section-form-main .row {
            flex-direction: column;
        }
        
        .section-form-main .col-3,
        .section-form-main .col-4 {
            width: 100%;
            margin-bottom: 30px;
            text-align: center;
        }
        
        /* Формы */
        .form-manager__form,
        .form-popup-callback__form,
        .form-popup-request__form {
            padding: 15px;
        }
        
        /* Подвал */
        .footer__top .row {
            flex-direction: column;
        }
        
        .footer__menu {
            margin-bottom: 20px;
        }
        
        /* Медиазапросы */
        @media (max-width: 767px) {
            .header-slider__inner {
                padding: 20px;
            }
            
            .section-company__box-company .row {
                flex-direction: column;
            }
            
            .section-company__col-img {
                margin-bottom: 20px;
            }
            
            .section-company__metric {
                text-align: center;
                margin-bottom: 20px;
            }
        }
        
        @media (min-width: 768px) {
            /* Для планшетов */
            .header-top {
                display: flex;
                justify-content: space-between;
            }
            
            .header-logo {
                width: auto;
                margin-bottom: 0;
            }
            
            .section-form-main .row {
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            .section-form-main .col-3 {
                width: 50%;
            }
            
            .section-form-main .col-4 {
                width: 50%;
            }
        }
    </style>
</head>
<body>
    <!-- Остальное содержимое HTML остается без изменений -->
    
    <script>
        // Адаптация меню для мобильных
        document.addEventListener('DOMContentLoaded', function() {
            var menuToggle = document.querySelector('.minmenu');
            var menu = document.getElementById('horizontal-multilevel-menu');
            
            if (menuToggle && menu) {
                menuToggle.addEventListener('click', function() {
                    if (menu.style.display === 'block') {
                        menu.style.display = 'none';
                    } else {
                        menu.style.display = 'block';
                    }
                });
            }
            
            // Адаптация слайдера
            if (window.innerWidth < 768) {
                var sliders = document.querySelectorAll('.owl-carousel');
                sliders.forEach(function(slider) {
                    slider.style.height = 'auto';
                });
            }
        });
        
        // Обработка изменения размера окна
        window.addEventListener('resize', function() {
            if (window.innerWidth >= 768) {
                var menu = document.getElementById('horizontal-multilevel-menu');
                if (menu) menu.style.display = 'block';
            } else {
                var menu = document.getElementById('horizontal-multilevel-menu');
                if (menu) menu.style.display = 'none';
            }
        });
    </script>
</body>
</html>
